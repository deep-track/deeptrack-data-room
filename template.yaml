AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Deeptrack Investor Data Room - AWS-native API and private document storage

Parameters:
  Auth0Issuer:
    Type: String
    Description: Auth0 issuer URL, for example https://tenant.eu.auth0.com
  Auth0Audience:
    Type: String
    Description: Auth0 API audience accepted by the data-room backend
  DataRoomOrigin:
    Type: String
    Description: Approved frontend origin, for example https://dataroom.deeptrack.io
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection string. Prefer supplying this through an AWS deployment secret workflow.
  DataRoomS3BucketName:
    Type: String
    Default: ''
    Description: Optional globally unique bucket name; leave blank to let CloudFormation generate it.
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-003d2ebd85c1a6e9b
    Description: Security group for the API Lambda (deeptrack-data-room-lambda); the database only accepts 5432 from this group.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-0ef55fe8d1f2bfb37,subnet-0747ba5733e95bb53
    Description: Private subnets in deeptrack-vpc (routed through the NAT gateway) so the Lambda can reach the private Postgres and Auth0.

Conditions:
  HasCustomBucketName: !Not [!Equals [!Ref DataRoomS3BucketName, '']]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 1024
    Architectures: [arm64]
    Environment:
      Variables:
        AUTH0_ISSUER: !Ref Auth0Issuer
        AUTH0_AUDIENCE: !Ref Auth0Audience
        DATA_ROOM_ORIGIN: !Ref DataRoomOrigin
        DATABASE_URL: !Ref DatabaseUrl
        DATA_ROOM_S3_BUCKET: !Ref DataRoomBucket
        DATABASE_SSL: 'true'
        DATA_ROOM_MAX_FILE_BYTES: '26214400'

Resources:
  DataRoomHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref DataRoomOrigin]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, OPTIONS]
        AllowCredentials: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  DataRoomApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: dist/handler.handler
      Runtime: nodejs20.x
      # The database is private (deeptrack-vpc), so the Lambda must run inside the VPC.
      # SAM adds AWSLambdaVPCAccessExecutionRole to the function role automatically.
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
        SubnetIds: !Ref PrivateSubnetIds
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataRoomBucket
      Events:
        Health:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /health, Method: GET }
        DocumentsGet:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /documents, Method: GET }
        DocumentsPost:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /documents, Method: POST }
        UploadsPost:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /uploads, Method: POST }
        DownloadGet:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: "/documents/{id}/download", Method: GET }
        # Routes the handler already serves but were never exposed.
        AccessStatusGet:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /access/status, Method: GET }
        AccessNdaPost:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /access/nda, Method: POST }
        AccessGrantsGet:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /access/grants, Method: GET }
        AccessGrantsPost:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /access/grants, Method: POST }
        AccessGrantRevokePost:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: "/access/grants/{id}/revoke", Method: POST }
        AuditGet:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /audit, Method: GET }
        DocumentStatusPost:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: "/documents/{id}/status", Method: POST }
        DocumentVersionsPost:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: "/documents/{id}/versions", Method: POST }
        # Private investor pipeline (admin-only, enforced in the handler).
        InvestorsGet:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /investors, Method: GET }
        InvestorsPost:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /investors, Method: POST }
        InvestorGet:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: "/investors/{id}", Method: GET }
        InvestorPost:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: "/investors/{id}", Method: POST }
        InvestorActivityPost:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: "/investors/{id}/activity", Method: POST }
        # MCP connector for Claude (see backend/src/mcp.ts).
        McpPost:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /mcp, Method: POST }
        McpGet:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /mcp, Method: GET }
        McpResourceMetadata:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /.well-known/oauth-protected-resource, Method: GET }
        McpResourceMetadataPath:
          Type: HttpApi
          Properties: { ApiId: !Ref DataRoomHttpApi, Path: /.well-known/oauth-protected-resource/mcp, Method: GET }

  DataRoomBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If [HasCustomBucketName, !Ref DataRoomS3BucketName, !Ref AWS::NoValue]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 2 }
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref DataRoomOrigin]
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ['*']
            MaxAge: 300

  DataRoomBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataRoomBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DataRoomBucket.Arn
              - !Sub '${DataRoomBucket.Arn}/*'
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

Outputs:
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub 'https://${DataRoomHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  BucketName:
    Description: Private S3 bucket name
    Value: !Ref DataRoomBucket
