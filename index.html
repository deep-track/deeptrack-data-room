<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deeptrack — Data Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#0A0D12;
    --ink-800:#12161F;
    --ink-700:#1A2028;
    --ink-650:#212836;
    --hairline:#2A3140;
    --hairline-soft:#1E2530;
    --fg:#D8DDE6;
    --fg-dim:#8A93A3;
    --fg-faint:#5B6373;
    --paper:#EAF4FB;
    --brand-blue:#0191DA;
    --brand-blue-light:#8AD1F5;
    --brand-blue-mid:#43AEE0;
    --brand-blue-dark:#0B6FA8;
    --seal:#0191DA;
    --seal-dim:#0B6FA8;
    --tier2:#6E90B8;
    --tier3:#B2604B;
    --good:#5FA97C;
    --bad:#C05A4E;
    --radius:3px;
    --serif:'Space Grotesk', 'IBM Plex Sans', sans-serif;
    --sans:'IBM Plex Sans', -apple-system, sans-serif;
    --mono:'IBM Plex Mono', SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink-900);
    color:var(--fg);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }
  a{color:inherit;}
  button{font-family:inherit;}
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--seal);
    outline-offset:2px;
  }
  ::selection{background:var(--seal-dim); color:var(--ink-900);}

  .mono{font-family:var(--mono);}
  .dim{color:var(--fg-dim);}
  .faint{color:var(--fg-faint);}
  .hidden{display:none !important;}

  /* ---------- Login ---------- */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
    background: radial-gradient(1200px 600px at 50% -10%, #122334 0%, var(--ink-900) 60%);
  }
  .login-card{ width:100%; max-width:380px; text-align:center; }

  .logo-lockup{ display:inline-flex; flex-direction:column; align-items:center; margin-bottom:22px; transform-origin:center; }
  .logo-lockup.deny{ animation:denyshake .5s; }
  @keyframes denyshake{
    0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(5px);}
    60%{transform:translateX(-4px);} 80%{transform:translateX(3px);}
  }
  .logo-lockup .bar{ transform-box:fill-box; transform-origin:center; }
  .logo-lockup.spin .bar1{ animation:barPulse .55s ease .0s; }
  .logo-lockup.spin .bar2{ animation:barPulse .55s ease .1s; }
  .logo-lockup.spin .bar3{ animation:barPulse .55s ease .2s; }
  @keyframes barPulse{ 0%{transform:scaleY(1);} 45%{transform:scaleY(1.4);} 100%{transform:scaleY(1);} }
  .logo-rule{ width:56px; height:2px; background:var(--brand-blue); margin:14px 0 10px; }
  .logo-tagline{ font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--fg-faint); transition:color .4s; }
  .logo-tagline.granted{ color:var(--brand-blue-mid); }

  .brand-room-label{ font-family:var(--serif); font-weight:700; font-size:30px; color:var(--paper); margin:22px 0 6px; letter-spacing:-.01em; }
  .brand-sub{ color:var(--fg-dim); font-size:13px; margin-bottom:34px; }

  .code-form{ text-align:left; }
  .field-label{ display:block; font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-faint); margin-bottom:8px; }
  input[type="text"], input[type="password"], input[type="url"], input[type="search"], select, textarea{
    width:100%; background:var(--ink-800); border:1px solid var(--hairline); color:var(--fg);
    padding:11px 12px; border-radius:var(--radius); font-family:var(--mono); font-size:14px; letter-spacing:.03em;
  }
  textarea{font-family:var(--sans); letter-spacing:normal; resize:vertical; min-height:64px;}
  select{font-family:var(--sans);}
  input::placeholder, textarea::placeholder{color:var(--fg-faint); font-family:var(--sans); letter-spacing:normal;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--seal); color:#fff; border:none; padding:11px 18px; border-radius:var(--radius);
    font-weight:600; font-size:13px; letter-spacing:.02em; cursor:pointer; transition:background .15s, transform .1s;
  }
  .btn:hover{ background:var(--brand-blue-mid); }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--fg-dim); border:1px solid var(--hairline); }
  .btn-ghost:hover{ color:var(--fg); border-color:var(--fg-faint); background:var(--ink-700); }
  .btn-danger{ background:var(--bad); color:#fff; }
  .btn-danger:hover{ background:#D06B5E; }
  .btn-sm{ padding:7px 12px; font-size:12px; }
  .btn-block{ width:100%; margin-top:18px; }

  .login-error{ margin-top:14px; font-size:12.5px; color:var(--bad); min-height:16px; }
  .login-foot{ margin-top:40px; font-size:11.5px; color:var(--fg-faint); line-height:1.6; }

  /* ---------- NDA gate ---------- */
  .nda-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px;
    background: radial-gradient(1200px 600px at 50% -10%, #122334 0%, var(--ink-900) 60%); }
  .nda-card{ width:100%; max-width:560px; }
  .nda-head{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .nda-title{ font-family:var(--serif); font-weight:700; font-size:22px; color:var(--paper); margin:0; }
  .nda-body{
    background:var(--ink-800); border:1px solid var(--hairline); border-radius:var(--radius);
    padding:22px; max-height:280px; overflow-y:auto; font-size:12.5px; color:var(--fg-dim); line-height:1.7;
  }
  .nda-body p{ margin:0 0 12px; }
  .nda-body p:last-child{ margin-bottom:0; }
  .nda-agree{ display:flex; align-items:flex-start; gap:10px; margin:20px 0; font-size:12.5px; color:var(--fg-dim); }
  .nda-agree input{ width:auto; margin-top:2px; }

  /* ---------- App shell ---------- */
  .app{ display:none; min-height:100vh; }
  .app.active{ display:flex; }
  .topbar{
    position:fixed; top:0; left:0; right:0; height:56px; background:var(--ink-800); border-bottom:1px solid var(--hairline);
    display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:20; gap:20px;
  }
  .topbar-brand{ display:flex; align-items:center; gap:12px; flex:none; }
  .topbar-logo{ display:block; }
  .topbar-room-label{ font-family:var(--serif); font-weight:600; font-size:14px; color:var(--paper); padding-left:12px; border-left:1px solid var(--hairline); letter-spacing:.01em; white-space:nowrap; }
  .topbar-search{ flex:1; max-width:360px; position:relative; }
  .topbar-search input{ padding:8px 12px 8px 32px; font-size:12.5px; }
  .topbar-search .sicon{ position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--fg-faint); pointer-events:none; }
  .topbar-search .sclear{ position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--fg-faint); cursor:pointer; font-size:14px; padding:2px 4px; }
  .topbar-right{ display:flex; align-items:center; gap:14px; flex:none; }
  .who{ font-family:var(--mono); font-size:11.5px; color:var(--fg-dim); display:flex; align-items:center; gap:8px; }
  .tier-chip{ font-family:var(--mono); font-size:10px; letter-spacing:.08em; padding:2px 7px; border-radius:2px; border:1px solid var(--hairline); color:var(--fg-dim); }

  .layout{ display:flex; width:100%; padding-top:56px; }
  .sidebar{ width:230px; flex:none; position:fixed; top:56px; bottom:0; left:0; border-right:1px solid var(--hairline); background:var(--ink-900); padding:22px 0; overflow-y:auto; }
  .sb-section-label{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-faint); padding:0 20px; margin:18px 0 8px; }
  .sb-item{ display:flex; align-items:center; justify-content:space-between; padding:9px 20px; cursor:pointer; color:var(--fg-dim); font-size:13.5px; border-left:2px solid transparent; gap:8px; }
  .sb-item span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sb-item:hover{ color:var(--fg); background:var(--ink-800); }
  .sb-item.active{ color:var(--paper); border-left-color:var(--seal); background:var(--ink-800); }
  .sb-count{ font-family:var(--mono); font-size:11px; color:var(--fg-faint); flex:none; }

  .main{ margin-left:230px; flex:1; padding:32px 44px 80px; max-width:980px; }
  .view-head{ margin-bottom:22px; }
  .breadcrumb{ font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--fg-faint); margin-bottom:10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .breadcrumb a{ cursor:pointer; color:var(--fg-dim); }
  .breadcrumb a:hover{ color:var(--brand-blue-mid); }
  .view-eyebrow{ font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--fg-faint); margin-bottom:6px;}
  .view-title{ font-family:var(--serif); font-size:26px; color:var(--paper); font-weight:700; margin:0; }
  .view-desc{ color:var(--fg-dim); font-size:13px; margin-top:6px; max-width:64ch; }

  /* ---------- Folder grid ---------- */
  .folder-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:12px; margin-top:6px; }
  .folder-card{
    background:var(--ink-800); border:1px solid var(--hairline); border-radius:var(--radius);
    padding:18px; cursor:pointer; transition:border-color .15s, transform .1s;
    display:flex; flex-direction:column; gap:10px;
  }
  .folder-card:hover{ border-color:var(--brand-blue); transform:translateY(-1px); }
  .folder-card .ficon{ color:var(--brand-blue-mid); }
  .folder-card .fname{ color:var(--fg); font-size:14px; font-weight:500; }
  .folder-card .fcount{ font-family:var(--mono); font-size:11px; color:var(--fg-faint); }

  /* ---------- Ledger table ---------- */
  .ledger{ border-top:1px solid var(--hairline); }
  .ledger-row{ display:grid; grid-template-columns:70px 1fr 60px 100px 90px 40px 34px; align-items:center; gap:14px; padding:15px 4px; border-bottom:1px solid var(--hairline-soft); cursor:pointer; }
  .ledger-row:hover{ background:var(--ink-800); }
  .ledger-id{ font-family:var(--mono); font-size:12px; color:var(--fg-faint); }
  .ledger-main .title{ color:var(--fg); font-size:14px; }
  .ledger-main .sub{ color:var(--fg-faint); font-size:12px; margin-top:2px; }
  .ledger-main .breadcrumb-tag{ font-family:var(--mono); font-size:10.5px; color:var(--brand-blue-mid); margin-top:3px; }
  .ledger-ver{ font-family:var(--mono); font-size:11px; color:var(--fg-faint); }
  .ledger-date{ font-family:var(--mono); font-size:11.5px; color:var(--fg-faint); text-align:right; }
  .ledger-qa{ font-family:var(--mono); font-size:11px; color:var(--fg-faint); text-align:right; }
  .ledger-dl{ display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:7px; border:1px solid var(--hairline); background:transparent; color:var(--fg-dim); cursor:pointer; }
  .ledger-dl:hover{ background:var(--ink-800); color:var(--fg); border-color:var(--fg-faint); }

  .stamp{ width:30px; height:30px; }
  .stamp circle.ring{ fill:none; stroke:var(--hairline); stroke-width:1.4; }
  .stamp circle.dot{ fill:var(--fg-faint); }
  .stamp.t1 circle.ring{ stroke:var(--good); }
  .stamp.t1 circle.dot.d1{ fill:var(--good); }
  .stamp.t2 circle.ring{ stroke:var(--tier2); }
  .stamp.t2 circle.dot.d1, .stamp.t2 circle.dot.d2{ fill:var(--tier2); }
  .stamp.t3 circle.ring{ stroke:var(--tier3); }
  .stamp.t3 circle.dot{ fill:var(--tier3); }

  .empty{ padding:50px 10px; text-align:center; color:var(--fg-faint); font-size:13px; border-top:1px solid var(--hairline); }
  .empty .el{ font-family:var(--serif); font-weight:600; color:var(--fg-dim); font-size:16px; margin-bottom:6px; }

  /* ---------- Drawer ---------- */
  .scrim{ position:fixed; inset:0; background:rgba(6,8,11,.6); z-index:29; display:none; }
  .scrim.active{ display:block; }
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:440px; max-width:92vw; background:var(--ink-800);
    border-left:1px solid var(--hairline); transform:translateX(100%); transition:transform .25s ease;
    z-index:30; overflow-y:auto; padding:26px 26px 40px;
  }
  .drawer.active{ transform:translateX(0); }
  .drawer-close{ background:none; border:none; color:var(--fg-faint); cursor:pointer; font-size:13px; font-family:var(--mono); padding:0; margin-bottom:22px; }
  .drawer-close:hover{ color:var(--fg); }
  .drawer-tier{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .drawer h2{ font-family:var(--serif); font-weight:700; font-size:21px; color:var(--paper); margin:0 0 6px; }
  .drawer-meta{ font-family:var(--mono); font-size:11px; color:var(--fg-faint); margin-bottom:18px; }
  .drawer-desc{ color:var(--fg-dim); font-size:13px; margin-bottom:20px; }
  .drawer hr{ border:none; border-top:1px solid var(--hairline); margin:22px 0; }
  .drawer h3.subhead{ font-family:var(--serif); font-weight:700; font-size:15px; color:var(--paper); margin:0 0 12px; }

  .version-row{ display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--hairline-soft); font-size:12.5px; }
  .version-row .vtag{ font-family:var(--mono); color:var(--brand-blue-mid); }
  .version-row .vnote{ color:var(--fg-dim); flex:1; margin:0 10px; }
  .version-row .vdate{ font-family:var(--mono); color:var(--fg-faint); white-space:nowrap; }
  .version-add{ display:flex; gap:8px; margin-top:12px; }
  .version-add input:first-child{ width:90px; flex:none; }

  .thread-msg{ padding:10px 0; border-bottom:1px solid var(--hairline-soft); }
  .thread-msg .who{ font-family:var(--mono); font-size:11px; color:var(--fg-faint); margin-bottom:4px; }
  .thread-msg .txt{ font-size:13px; color:var(--fg); }
  .thread-input-row{ display:flex; gap:8px; margin-top:14px; }
  .thread-input-row textarea{ flex:1; min-height:44px; }

  .firm-tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .firm-tab{ font-family:var(--mono); font-size:11px; padding:5px 9px; border-radius:2px; border:1px solid var(--hairline); color:var(--fg-dim); cursor:pointer; }
  .firm-tab.active{ border-color:var(--seal); color:var(--paper); }

  /* ---------- Forms / admin ---------- */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  .form-grid .full{ grid-column:1 / -1; }
  .panel{ background:var(--ink-800); border:1px solid var(--hairline); border-radius:var(--radius); padding:22px; margin-bottom:22px; }
  .panel h3{ font-family:var(--serif); font-weight:700; font-size:17px; color:var(--paper); margin:0 0 16px; }
  .row-between{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .code-line{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--hairline-soft); font-size:13px; }
  .code-line .fname{ color:var(--fg); }
  .code-line .fcode{ font-family:var(--mono); color:var(--fg-dim); font-size:12px; }
  .code-line .factions{ display:flex; gap:6px; align-items:center; }

  .activity-row{ display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--hairline-soft); font-size:12.5px; }
  .activity-row .a-what{ color:var(--fg-dim); }
  .activity-row .a-when{ font-family:var(--mono); color:var(--fg-faint); white-space:nowrap; }

  .banner{ background:#0F2333; border:1px solid var(--seal-dim); color:#8FD1F5; font-size:12.5px; padding:10px 14px; border-radius:var(--radius); margin-bottom:18px; }

  /* ---------- Attach mode (link vs upload) ---------- */
  .attach-toggle{ display:flex; gap:8px; margin-bottom:10px; }
  .attach-tab{ font-family:var(--mono); font-size:11px; padding:6px 11px; border-radius:2px; border:1px solid var(--hairline); color:var(--fg-dim); cursor:pointer; }
  .attach-tab.active{ border-color:var(--seal); color:var(--paper); background:var(--ink-700); }
  .file-drop{
    border:1px dashed var(--hairline); border-radius:var(--radius); padding:16px;
    display:flex; align-items:center; gap:12px; background:var(--ink-900);
  }
  .file-drop.dragover{ border-color:var(--brand-blue); background:var(--ink-700); }
  .file-drop-info{ flex:1; font-size:12.5px; color:var(--fg-dim); }
  .file-drop-info .fname{ color:var(--fg); }
  .file-drop-hint{ font-size:11.5px; color:var(--fg-faint); margin-top:6px; }
  .upload-progress{ font-family:var(--mono); font-size:11.5px; color:var(--brand-blue-mid); margin-top:8px; }
  .upload-error{ font-size:12px; color:var(--bad); margin-top:8px; }

  @media (max-width: 760px){
    .sidebar{ display:none; }
    .main{ margin-left:0; padding:24px 18px 70px; }
    .topbar-search{ display:none; }
    .ledger-row{ grid-template-columns:50px 1fr 30px 34px; }
    .ledger-date, .ledger-qa, .ledger-ver{ display:none; }
    .form-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script>
(function(){

/* ================= Storage layer (Vercel serverless + Upstash Redis) ================= */
let persistent = true;

async function stGet(key){
  try{
    const r = await fetch('/api/kv?key=' + encodeURIComponent(key));
    if(!r.ok) throw new Error('bad status ' + r.status);
    const data = await r.json();
    return (data.value !== null && data.value !== undefined) ? JSON.parse(data.value) : null;
  }catch(e){ persistent = false; return null; }
}
async function stSet(key, value){
  try{
    const r = await fetch('/api/kv', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ key, value: JSON.stringify(value) }) });
    if(!r.ok) throw new Error('bad status ' + r.status);
    return true;
  }catch(e){ persistent = false; return false; }
}
function persistenceBanner(){
  if(persistent) return '';
  return `<div class="banner">Storage isn't connected right now, so nothing will be saved — check that the Upstash/KV
    integration is attached to this Vercel project and redeploy. The room still works for this session.</div>`;
}

/* ================= Safe read-modify-write helpers =================
   Every save re-fetches the latest copy from Redis first, applies the
   change on top of THAT, then saves — instead of overwriting the whole
   key with a possibly-stale in-memory copy. This prevents one open tab
   from silently wiping out another tab's changes (last-write-wins). */
async function saveCore(mutateFn){
  const fresh = await stGet('dataroom-core');
  core = fresh || core || defaultCore();
  mutateFn(core);
  await stSet('dataroom-core', core);
  return core;
}
async function saveAccess(mutateFn){
  const fresh = await stGet('dataroom-access');
  access = fresh || access || defaultAccess();
  mutateFn(access);
  await stSet('dataroom-access', access);
  return access;
}
async function saveThreads(mutateFn){
  const fresh = await stGet('dataroom-threads');
  threads = fresh || threads || {};
  mutateFn(threads);
  await stSet('dataroom-threads', threads);
  return threads;
}

/* ================= File upload (Vercel Blob, direct client upload) ================= */
const MAX_UPLOAD_BYTES = 10 * 1024 * 1024; // 10MB — enforced both here and server-side
let blobClientPromise = null;
function loadBlobClient(){
  if(!blobClientPromise){
    blobClientPromise = import('https://esm.sh/@vercel/blob@0.27.1/client');
  }
  return blobClientPromise;
}

async function uploadFile(file, onProgressText){
  if(file.size > MAX_UPLOAD_BYTES){
    throw new Error('That file is ' + (file.size/1024/1024).toFixed(1) + 'MB — uploads are capped at 10MB. Use the Link option for larger files (Drive, Notion, etc).');
  }
  if(onProgressText) onProgressText('Uploading…');
  let blobClient;
  try{
    blobClient = await loadBlobClient();
  }catch(e){
    throw new Error('Could not load the upload client — check your connection and try again.');
  }
  const blob = await blobClient.upload(file.name, file, {
    access: 'public',
    handleUploadUrl: '/api/upload',
    contentType: file.type || 'application/octet-stream',
  });
  return { url: blob.url, pathname: blob.pathname };
}

/* ================= Download ================= */
function downloadIcon(){
  return `<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 1.5V10M7.5 10L4 6.5M7.5 10L11 6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12.5H13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`;
}
async function downloadDoc(doc, btnEl){
  if(!doc || !doc.link) return;

  if(doc.sourceType !== 'upload'){
    window.open(doc.link, '_blank', 'noopener');
    return;
  }

  const orig = btnEl ? btnEl.innerHTML : null;
  if(btnEl) btnEl.innerHTML = '…';

  try {
    // Ask our server to generate an authorized download URL
    const r = await fetch('/api/download?url=' + encodeURIComponent(doc.link));

    if(!r.ok){
      const data = await r.json().catch(() => ({}));
      throw new Error(data.error || 'Could not create download link');
    }

    const data = await r.json();

    // Open the authorized URL directly
    window.open(data.url, '_blank', 'noopener');

  } catch(e) {
    console.error('Download failed:', e);
    alert(e.message || 'Download failed.');
  } finally {
    if(btnEl) btnEl.innerHTML = orig;
  }
}

function buildSeedDocuments(){
  const docs = [];
  let n = 0;
  const baseDate = new Date('2026-04-01T00:00:00Z').getTime();
  CATS.forEach(cat => {
    cat.sub.forEach(sub => {
      sub.docs.forEach(d => {
        n++;
        const addedAt = new Date(baseDate + n*29*3600*1000).toISOString();
        docs.push({
          id: 'seed-' + n,
          code: 'DT-' + String(n).padStart(3,'0'),
          title: d.title,
          category: cat.id,
          subfolder: sub.id,
          tier: d.tier,
          link: '',
          sourceType: 'link',
          fileName: '',
          description: d.desc,
          addedBy: 'Founder',
          addedAt,
          versions: [{version:'1.0', date: addedAt, note:'Initial upload'}]
        });
      });
    });
  });
  return docs;
}

function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,7).toUpperCase(); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ const d = new Date(iso); return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function fmtDateTime(iso){ const d = new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nextDocCode(docs){ const n = docs.length + 1; return 'DT-' + String(n).padStart(3,'0'); }
function catById(id){ return CATS.find(c=>c.id===id); }
function subById(catId, subId){ const c = catById(catId); return c ? c.sub.find(s=>s.id===subId) : null; }

function defaultAccess(){ return { founderCode:'1313', cosCode:'STAFF-2290', investors:[] }; }
function defaultCore(){ return { documents: buildSeedDocuments() }; }

async function loadAll(){
  access = await stGet('dataroom-access');
  if(!access){ access = defaultAccess(); await stSet('dataroom-access', access); }
  else{
    const d = defaultAccess(); let patched = false;
    if(!access.founderCode){ access.founderCode = d.founderCode; patched = true; }
    if(!access.cosCode){ access.cosCode = d.cosCode; patched = true; }
    if(!Array.isArray(access.investors)){ access.investors = []; patched = true; }
    if(patched){ await stSet('dataroom-access', access); }
  }
  core = await stGet('dataroom-core');
  if(!core){ core = defaultCore(); await stSet('dataroom-core', core); }
  activity = await stGet('dataroom-activity');
  if(!activity){ activity = []; await stSet('dataroom-activity', activity); }
  threads = await stGet('dataroom-threads');
  if(!threads){ threads = {}; await stSet('dataroom-threads', threads); }
}

async function logActivity(action, doc){
  const entry = {
    ts: nowISO(),
    who: session.role === 'investor' ? session.firm : (session.role === 'founder' ? 'Founder' : 'Chief of Staff'),
    role: session.role, action,
    docId: doc ? doc.id : null,
    docTitle: doc ? doc.title : null
  };
  const fresh = await stGet('dataroom-activity');
  activity = fresh || activity || [];
  activity.unshift(entry);
  activity = activity.slice(0, 400);
  await stSet('dataroom-activity', activity);
}

/* ================= Auth ================= */
function norm(s){ return String(s||'').trim().toUpperCase().replace(/\s+/g,''); }
function tryCode(code){
  code = norm(code);
  if(!code) return null;
  if(code === norm(access.founderCode)) return {role:'founder', tier:3};
  if(code === norm(access.cosCode)) return {role:'cos', tier:3};
  const inv = access.investors.find(i => norm(i.code) === code);
  if(inv) return {role:'investor', firm:inv.firm, tier:inv.tier, investorId:inv.id};
  return null;
}

/* ================= Helpers: documents ================= */
function allVisibleDocs(){
  let docs = core.documents;
  if(session.role === 'investor'){ docs = docs.filter(d => d.tier <= session.tier); }
  return docs;
}
function docsForSub(catId, subId){
  return allVisibleDocs().filter(d => d.category === catId && d.subfolder === subId)
    .sort((a,b)=> a.code < b.code ? -1 : 1);
}
function countForSub(catId, subId){ return docsForSub(catId, subId).length; }
function countForCat(catId){ return allVisibleDocs().filter(d => d.category === catId).length; }
function latestVersion(doc){ return doc.versions && doc.versions.length ? doc.versions[doc.versions.length-1] : null; }

function roleLabel(){
  if(session.role==='founder') return 'Founder';
  if(session.role==='cos') return 'Chief of Staff';
  return session.firm;
}

  CATS.forEach(c => {

      <span>${esc(c.label)}</span><span class="sb-count">${countForCat(c.id)}</span>

  if(isAdmin){
    html += `<div class="sb-section-label">Room management</div>

  return `<svg class="stamp t${tier}" viewBox="0 0 30 30"><circle class="ring" cx="15" cy="15" r="13"/>${dots}</svg>`;
}

      <div class="view-eyebrow">Folder ${docs.length ? '· ' + docs.length + ' ' + (docs.length===1?'entry':'entries') : ''}</div>

    </div>
    <div class="ledger">${rows}</div>
    ${docs.length ? '' : emptyMsg}
    <div id="addDocPanel"></div>
  `;

  main.querySelector('[data-nav="cat"]').addEventListener('click', () => { activeSub = null; renderMainContent(); renderSidebar(); });
  main.querySelectorAll('.ledger-row').forEach(el => el.addEventListener('click', () => openDrawer(el.getAttribute('data-doc'))));
  main.querySelectorAll('[data-dl]').forEach(el => el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const d = docs.find(x => x.id === el.getAttribute('data-dl'));
    downloadDoc(d, el);
  }));
  if(isAdmin){
    const btn = document.getElementById('addDocBtn');
    if(btn) btn.addEventListener('click', () => renderAddDocForm(catId, subId));
  }
}

function threadCountForDoc(docId){
  const t = threads[docId];
  if(!t) return 0;
  return Object.values(t).reduce((sum, arr) => sum + arr.length, 0);
}

            <div class="attach-tab" data-mode="upload">Upload a file</div>
          </div>
          <div id="attachLinkPane">
            <input type="url" id="fLink" placeholder="https://">
          </div>
          <div id="attachUploadPane" class="hidden">
            <div class="file-drop" id="fileDrop">
              <input type="file" id="fFile" class="hidden">
              <button type="button" class="btn btn-ghost btn-sm" id="fileChooseBtn">Choose file</button>
              <div class="file-drop-info" id="fileDropInfo">No file selected — or drag one in here.</div>

        </div>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-sm" id="fSave">File document</button>
        <button class="btn btn-ghost btn-sm" id="fCancel">Cancel</button>
      </div>
    </div>
  `;

  let attachMode = 'link';
  let chosenFile = null;

  const catSelect = document.getElementById('fCat');
  const subSelect = document.getElementById('fSub');
  catSelect.addEventListener('change', () => {
    const c = catById(catSelect.value);
    subSelect.innerHTML = c.sub.map(s => `<option value="${s.id}">${esc(s.label)}</option>`).join('');
  });

  const linkPane = document.getElementById('attachLinkPane');
  const uploadPane = document.getElementById('attachUploadPane');
  panel.querySelectorAll('.attach-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      attachMode = tab.getAttribute('data-mode');
      panel.querySelectorAll('.attach-tab').forEach(t => t.classList.toggle('active', t===tab));
      linkPane.classList.toggle('hidden', attachMode!=='link');
      uploadPane.classList.toggle('hidden', attachMode!=='upload');
    });
  });

  const fileInput = document.getElementById('fFile');
  const fileDrop = document.getElementById('fileDrop');
  const fileInfo = document.getElementById('fileDropInfo');
  const uploadErrorEl = document.getElementById('uploadError');
  document.getElementById('fileChooseBtn').addEventListener('click', () => fileInput.click());
  function setChosenFile(file){
    chosenFile = file;
    uploadErrorEl.classList.add('hidden');
    if(file){
      const sizeTxt = file.size > 1024*1024 ? (file.size/1024/1024).toFixed(1)+'MB' : Math.ceil(file.size/1024)+'KB';
      fileInfo.innerHTML = `<span class="fname">${esc(file.name)}</span> · ${sizeTxt}`;
    }else{
      fileInfo.textContent = 'No file selected — or drag one in here.';
    }
  }
  fileInput.addEventListener('change', () => setChosenFile(fileInput.files[0] || null));
  ['dragover','dragenter'].forEach(evt => fileDrop.addEventListener(evt, e => { e.preventDefault(); fileDrop.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(evt => fileDrop.addEventListener(evt, e => { e.preventDefault(); fileDrop.classList.remove('dragover'); }));
  fileDrop.addEventListener('drop', e => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) setChosenFile(f);
  });

  document.getElementById('fCancel').addEventListener('click', () => { panel.innerHTML=''; });

  document.getElementById('fSave').addEventListener('click', async () => {
    const title = document.getElementById('fTitle').value.trim();
    if(!title){ document.getElementById('fTitle').focus(); return; }

    const saveBtn = document.getElementById('fSave');
    const progressEl = document.getElementById('uploadProgress');
    uploadErrorEl.classList.add('hidden');

    let link = '';
    let sourceType = 'link';
    let fileName = '';

    if(attachMode === 'upload'){
      if(!chosenFile){
        uploadErrorEl.textContent = 'Choose a file first, or switch to the Link tab.';
        uploadErrorEl.classList.remove('hidden');
        return;
      }
      saveBtn.disabled = true;
      progressEl.classList.remove('hidden');
      try{
        const result = await uploadFile(chosenFile, (txt) => { progressEl.textContent = txt; });
        link = result.url;
        sourceType = 'upload';
        fileName = chosenFile.name;
      }catch(err){
        saveBtn.disabled = false;
        progressEl.classList.add('hidden');
        uploadErrorEl.textContent = err.message || 'Upload failed. Try again, or use the Link tab instead.';
        uploadErrorEl.classList.remove('hidden');
        return;
      }
      progressEl.classList.add('hidden');
    }else{
      link = document.getElementById('fLink').value.trim();
    }

    const addedAt = nowISO();
    const doc = {
      id: uid('doc'),
      code: nextDocCode(core.documents),
      title,
      category: catSelect.value,
      subfolder: subSelect.value,
      tier: parseInt(document.getElementById('fTier').value,10),
      link,
      sourceType,
      fileName,
      description: document.getElementById('fDesc').value.trim(),
      addedBy: roleLabel(),
      addedAt,
      versions: [{ version: document.getElementById('fVer').value.trim() || '1.0', date: addedAt, note:'Initial upload' }]
    };
    await saveCore(c => { c.documents.push(doc); });
    await logActivity('filed a document', doc);
    activeCat = doc.category; activeSub = doc.subfolder;
    renderApp();
  });
}

/* ================= Render: Drawer (doc detail + versions + Q&A) ================= */
function closeDrawer(){
  document.getElementById('scrim').classList.remove('active');
  document.getElementById('drawer').classList.remove('active');
  drawerDocId = null;
}

async function openDrawer(docId){
  const doc = core.documents.find(d => d.id === docId);
  if(!doc) return;
  drawerDocId = docId;

  if(session.role === 'investor'){ await logActivity('opened a document', doc); }

  if(session.role === 'investor'){ drawerFirmTab = session.investorId; }
  else{
    const firmIds = Object.keys(threads[doc.id] || {});
    drawerFirmTab = firmIds.length ? firmIds[0] : null;
  }

  renderDrawer(doc);
  document.getElementById('scrim').classList.add('active');
  document.getElementById('drawer').classList.add('active');
}

function renderDrawer(doc){
  const isAdmin = session.role === 'founder' || session.role === 'cos';
  const drawer = document.getElementById('drawer');
  const cat = catById(doc.category); const sub = subById(doc.category, doc.subfolder);

  let firmTabsHtml = '';
  if(isAdmin){
    const firmIds = Object.keys(threads[doc.id] || {});
    if(firmIds.length){
      firmTabsHtml = `<div class="firm-tabs">` + firmIds.map(fid => {
        const inv = access.investors.find(i => i.id === fid);
        const name = inv ? inv.firm : 'Unknown firm';
        return `<div class="firm-tab ${drawerFirmTab===fid?'active':''}" data-firm="${fid}">${esc(name)}</div>`;
      }).join('') + `</div>`;
    }
  }

  const msgs = (threads[doc.id] && drawerFirmTab && threads[doc.id][drawerFirmTab]) || [];
  let msgsHtml = msgs.length
    ? msgs.map(m => `<div class="thread-msg"><div class="who">${esc(m.author)} · ${fmtDateTime(m.ts)}</div><div class="txt">${esc(m.text)}</div></div>`).join('')
    : `<div class="faint" style="padding:10px 0; font-size:12.5px;">No questions on this document yet.</div>`;

  const canWrite = session.role === 'investor' || (isAdmin && drawerFirmTab);

  const versions = (doc.versions || []).slice().reverse();
  const versionsHtml = versions.map(v => `
    <div class="version-row">
      <span class="vtag">v${esc(v.version)}</span>
      <span class="vnote">${esc(v.note||'')}</span>
      <span class="vdate">${fmtDate(v.date)}</span>
    </div>`).join('') || `<div class="faint" style="font-size:12.5px; padding:6px 0;">No version history.</div>`;

  const openLabel = doc.sourceType === 'upload' ? 'Download document ↓' : 'Open document ↗';
  const linkBlock = doc.link
    ? `<button class="btn btn-sm" id="drawerDlBtn">${openLabel}</button>
       ${doc.sourceType === 'upload' && doc.fileName ? `<div class="faint mono" style="font-size:11px; margin-top:8px;">${esc(doc.fileName)} · uploaded to the room</div>` : ''}`
    : `<div class="faint" style="font-size:12.5px;">No file or link filed yet.</div>`;

  drawer.innerHTML = `
    <button class="drawer-close" id="drawerCloseBtn">← Back to room</button>
    <div class="breadcrumb">${esc(cat?cat.label:'')} <span>/</span> ${esc(sub?sub.label:'')}</div>
    <div class="drawer-tier">${stampSVG(doc.tier)}<span class="faint mono" style="font-size:11px;">${TIER_LABEL[doc.tier].toUpperCase()} CLEARANCE</span></div>
    <h2>${esc(doc.title)}</h2>
    <div class="drawer-meta">${esc(doc.code)} · filed by ${esc(doc.addedBy)} · ${fmtDate(doc.addedAt)}</div>
    ${doc.description ? `<div class="drawer-desc">${esc(doc.description)}</div>` : ''}
    ${linkBlock}

    <hr>
    <h3 class="subhead">Version history</h3>
    <div id="versionList">${versionsHtml}</div>
    ${isAdmin ? `
      <div class="version-add">
        <input type="text" id="vNewVersion" placeholder="1.1">
        <input type="text" id="vNewNote" placeholder="What changed in this version">
        <button class="btn btn-sm" id="vAddBtn">Add</button>
      </div>` : ''}

    <hr>
    <h3 class="subhead">Diligence notes ${isAdmin ? '' : '— visible only to the company'}</h3>
    ${firmTabsHtml}
    <div id="threadMsgs">${msgsHtml}</div>
    ${canWrite ? `
      <div class="thread-input-row">
        <textarea id="threadInput" placeholder="${session.role==='investor' ? 'Ask a question about this document…' : 'Reply to '+ (access.investors.find(i=>i.id===drawerFirmTab)||{}).firm + '…'}"></textarea>
        <button class="btn btn-sm" id="threadSend">Send</button>
      </div>` : (isAdmin ? `<div class="faint" style="font-size:12px; margin-top:10px;">Select a firm above once they've asked something.</div>` : '')}
  `;

  document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);
  const drawerDlBtn = document.getElementById('drawerDlBtn');
  if(drawerDlBtn) drawerDlBtn.addEventListener('click', () => downloadDoc(doc, drawerDlBtn));
  drawer.querySelectorAll('[data-firm]').forEach(el => {
    el.addEventListener('click', () => { drawerFirmTab = el.getAttribute('data-firm'); renderDrawer(doc); });
  });

  const vAddBtn = document.getElementById('vAddBtn');
  if(vAddBtn){
    vAddBtn.addEventListener('click', async () => {
      const verInput = document.getElementById('vNewVersion');
      const noteInput = document.getElementById('vNewNote');
      const version = verInput.value.trim();
      if(!version) { verInput.focus(); return; }
      const docId = doc.id;
      const newVersion = { version, date: nowISO(), note: noteInput.value.trim() };
      const fresh = await saveCore(c => {
        const d = c.documents.find(x => x.id === docId);
        if(d){ d.versions = d.versions || []; d.versions.push(newVersion); }
      });
      const updatedDoc = fresh.documents.find(x => x.id === docId) || doc;
      await logActivity('added version ' + version + ' to', updatedDoc);
      renderDrawer(updatedDoc);
    });
  }

  const sendBtn = document.getElementById('threadSend');
  if(sendBtn){
    sendBtn.addEventListener('click', async () => {
      const ta = document.getElementById('threadInput');
      const text = ta.value.trim();
      if(!text) return;
      const firmId = session.role === 'investor' ? session.investorId : drawerFirmTab;
      if(!firmId) return;
      const docId = doc.id;
      const newMsg = { author: roleLabel(), text, ts: nowISO() };
      await saveThreads(t => {
        t[docId] = t[docId] || {};
        t[docId][firmId] = t[docId][firmId] || [];
        t[docId][firmId].push(newMsg);
      });
      await logActivity(session.role==='investor' ? 'asked a question' : 'replied', doc);
      renderDrawer(doc);
    });
  }
}

/* ================= Render: Admin — Activity ================= */
function activityToCSV(){
  const header = ['Timestamp','Who','Role','Action','Document'];
  const lines = [header.join(',')];
  activity.forEach(a => {
    const row = [a.ts, a.who, a.role, a.action, a.docTitle||''].map(v => {
      const s = String(v==null?'':v).replace(/"/g,'""');
      return /[",\n]/.test(s) ? `"${s}"` : s;
    });
    lines.push(row.join(','));
  });
  return lines.join('\n');
}

function renderActivityView(){
  const main = document.getElementById('mainView');
  let rows = activity.map(a => `
    <div class="activity-row">
      <div class="a-what"><strong style="color:var(--fg);">${esc(a.who)}</strong> ${esc(a.action)}${a.docTitle ? ' — <span class="dim">'+esc(a.docTitle)+'</span>' : ''}</div>
      <div class="a-when">${fmtDateTime(a.ts)}</div>
    </div>`).join('');
  main.innerHTML = `
    <div class="view-head">
      <div class="view-eyebrow">Management</div>
      <div class="row-between">
        <div>
          <h1 class="view-title">Room activity</h1>
          <div class="view-desc">Every sign-in, filing, document open and question, newest first. This is your read on who's actually diligencing.</div>
        </div>
        <button class="btn btn-sm" id="exportBtn">Export CSV</button>
      </div>
    </div>
    ${activity.length ? `<div class="ledger">${rows}</div>` : `<div class="empty"><div class="el">Quiet so far.</div>Activity appears here once someone signs in.</div>`}
  `;
  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn){
    exportBtn.addEventListener('click', () => {
      const csv = activityToCSV();
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'deeptrack-dataroom-activity-' + nowISO().slice(0,10) + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }
}

        </div>
      </div>
      <button class="btn btn-sm" id="issueBtn">Issue code</button>
    </div>
  `;

  renderInvestorList();

  document.getElementById('saveCodesBtn').addEventListener('click', async () => {
    const f = document.getElementById('setFounder').value.trim();
    const c = document.getElementById('setCos').value.trim();
    if(!f || !c) return;
    await saveAccess(a => { a.founderCode = f; a.cosCode = c; });
    renderApp();
  });

  document.getElementById('issueBtn').addEventListener('click', async () => {
    const firm = document.getElementById('invFirm').value.trim();
    if(!firm) return;
    const tier = parseInt(document.getElementById('invTier').value,10);
    const inv = { id: uid('inv'), firm, tier, code: uid('DT-INV'), ndaAcceptedAt: null };
    await saveAccess(a => { a.investors.push(inv); });
    await logActivity('issued a code for ' + firm);
    renderSettingsView();
  });
}

function renderInvestorList(){
  const wrap = document.getElementById('investorList');
  if(!access.investors.length){
    wrap.innerHTML = `<div class="faint" style="font-size:12.5px; padding:8px 0;">No investor codes issued yet.</div>`;
    return;
  }
  wrap.innerHTML = access.investors.map(inv => `
    <div class="code-line">
      <span class="fname">${esc(inv.firm)} <span class="faint mono" style="font-size:11px;">· ${TIER_LABEL[inv.tier]} · ${inv.ndaAcceptedAt ? 'NDA signed' : 'NDA pending'}</span></span>
      <span class="factions">
        <span class="fcode">${esc(inv.code)}</span>
        <button class="btn btn-ghost btn-sm" data-upgrade="${inv.id}">${inv.tier===1 ? 'Grant diligence' : 'Set general'}</button>
        <button class="btn btn-ghost btn-sm" data-revoke="${inv.id}">Revoke</button>
      </span>
    </div>
  `).join('');

  wrap.querySelectorAll('[data-upgrade]').forEach(el => {
    el.addEventListener('click', async () => {
      const id = el.getAttribute('data-upgrade');
      let firmName = '';
      await saveAccess(a => {
        const inv = a.investors.find(i => i.id === id);
        if(inv){ inv.tier = inv.tier === 1 ? 2 : 1; firmName = inv.firm; }
      });
      await logActivity('changed clearance for ' + firmName);
      renderSettingsView();
    });
  });
  wrap.querySelectorAll('[data-revoke]').forEach(el => {
    el.addEventListener('click', async () => {
      const id = el.getAttribute('data-revoke');
      const inv = access.investors.find(i => i.id === id);
      if(!inv || !confirm('Revoke access for ' + inv.firm + '? Their code will stop working immediately.')) return;
      await saveAccess(a => { a.investors = a.investors.filter(i => i.id !== id); });
      await logActivity('revoked access for ' + inv.firm);
      renderSettingsView();
    });
  });
}

/* ================= Live sync =================
   Polls for changes made by other open sessions (e.g. two people in the
   room at once) and refreshes the view so nobody is looking at a stale
   copy. Skipped while the user is actively typing so we don't yank an
   in-progress form or message out from under them. */
function userIsTyping(){
  const el = document.activeElement;
  return !!(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA'));
}
async function pollForUpdates(){
  if(!session || userIsTyping()) return;
  try{
    const [freshCore, freshAccess, freshThreads] = await Promise.all([
      stGet('dataroom-core'), stGet('dataroom-access'), stGet('dataroom-threads')
    ]);
    let changed = false;
    if(freshCore && JSON.stringify(freshCore) !== JSON.stringify(core)){ core = freshCore; changed = true; }
    if(freshAccess && JSON.stringify(freshAccess) !== JSON.stringify(access)){ access = freshAccess; changed = true; }
    if(freshThreads && JSON.stringify(freshThreads) !== JSON.stringify(threads)){ threads = freshThreads; changed = true; }
    if(changed){
      if(drawerDocId){ const d = core.documents.find(x => x.id === drawerDocId); if(d) renderDrawer(d); else closeDrawer(); }
      else renderApp();
    }
  }catch(e){ /* stay on current state if a poll fails */ }
}
setInterval(pollForUpdates, 8000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) pollForUpdates(); });

/* ================= Boot ================= */
async function boot(){
  ROOT.innerHTML = `<div class="login-screen"><div class="dim mono" style="font-size:12px;">Opening the room…</div></div>`;
  await loadAll();
  renderLogin();
}
boot();

})();
