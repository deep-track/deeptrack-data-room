version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: eu-west-1
    STACK_NAME: deeptrack-investor-data-room
    FRONTEND_BUCKET: investors-deeptrack-io-frontend-eu-west-1
    CLOUDFRONT_ID: E3JP1T0XSJ1O0M
    AUTH0_ISSUER: https://dev-08kwsss3wr77v0k0.us.auth0.com/
    AUTH0_AUDIENCE: https://api.deeptrack.io/data-room
    DATA_ROOM_ORIGIN: https://investors.deeptrack.io
    LAMBDA_SG: sg-003d2ebd85c1a6e9b

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing SAM CLI..."
      - wget -q https://github.com/aws/aws-sam-cli/releases/latest/download/aws-sam-cli-linux-x86_64.zip -O /tmp/sam.zip
      - unzip -q /tmp/sam.zip -d /tmp/sam
      - sudo /tmp/sam/install --update
      - sam --version

  pre_build:
    commands:
      - echo "Fetching secrets and stack outputs..."
      - |
        cat > /tmp/build_db_url.py << 'PYEOF'
        import sys, json, urllib.parse
        d = json.load(sys.stdin)
        pw = urllib.parse.quote(d['password'], safe='')
        print(f"postgresql://{d['username']}:{pw}@{d['host']}:{d['port']}/{d['dbname']}?sslmode=require")
        PYEOF
      - |
        DB_SECRET=$(aws secretsmanager get-secret-value --secret-id deeptrack/postgres/master --region eu-west-1 --query 'SecretString' --output text)
        DB_URL=$(echo "$DB_SECRET" | python3 /tmp/build_db_url.py)
        echo "DB_URL=$DB_URL" >> $CODEBUILD_ENV_FILE
      - |
        API_URL=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --region eu-west-1 --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' --output text)
        echo "API_URL=$API_URL" >> $CODEBUILD_ENV_FILE

  build:
    commands:
      - echo "Building backend..."
      - cd backend && npm ci && npm run build && cd ..
      - echo "SAM build..."
      - sam build --template-file template.yaml
      - echo "SAM deploy..."
      - sam deploy --template-file .aws-sam/build/template.yaml --stack-name $STACK_NAME --region eu-west-1 --capabilities CAPABILITY_IAM --resolve-s3 --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides "Auth0Issuer=$AUTH0_ISSUER" "Auth0Audience=$AUTH0_AUDIENCE" "DataRoomOrigin=$DATA_ROOM_ORIGIN" "DatabaseUrl=$DB_URL" "LambdaSecurityGroupId=$LAMBDA_SG"
      - echo "Building frontend..."
      - |
        cat > .env.production <<ENV
        VITE_AUTH0_DOMAIN=dev-08kwsss3wr77v0k0.us.auth0.com
        VITE_AUTH0_CLIENT_ID=2nsfWPfcCPkxA3N7Me4aUwjlSsDeoFbM
        VITE_AUTH0_AUDIENCE=https://api.deeptrack.io/data-room
        VITE_AUTH0_ROLE_CLAIM=https://deeptrack.io/roles
        VITE_DATA_ROOM_API_BASE_URL=$API_URL
        ENV
      - npm ci
      - npm run build

  post_build:
    commands:
      - echo "Deploying frontend to S3..."
      - aws s3 sync dist/ s3://$FRONTEND_BUCKET/ --delete
      - echo "Invalidating CloudFront cache..."
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "/*"
      - echo "Deployment complete."

artifacts:
  files: '**/*'
  base-directory: dist
